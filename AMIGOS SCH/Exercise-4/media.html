<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media</title>
  </head>
  <body>
    <section>
      <h1>Youtube Video</h1>
      <iframe
        controls
        width="560"
        height="315"
        src="https://www.youtube.com/embed/Pv3r_BxuttA?si=7QfGxwDJ_Yu2Nfrf"
        title="YouTube video player"
        frameborder="0"
        allow="
          accelerometer;
          autoplay;
          clipboard-write;
          encrypted-media;
          gyroscope;
          picture-in-picture;
          web-share;
        "
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </section>
    <br /><br />
    <article>
      <h1>Daasebre Gyamenah kokooko MP3</h1>
      <audio controls src="Daasebre-Gyamenah-–-Kokooko.mp3">
        Daasebre-Gyamena
      </audio>
    </article>

    <article>
      <h1>Short Video clip</h1>
      <video
        loop
        muted
        autoplay
        controls
        height="315"
        width="560"
        src="cycling.mp4"
      ></video>
    </article>
  </body>
</html>
